<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programming Demo Test</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='7' y='22' font-family='Arial' font-weight='700' font-size='18' fill='%23fff'%3EC%3C/text%3E%3Crect x='19' y='19' width='7' height='3' fill='%23f5d547'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- ============ WORKSPACE ============ -->
  <section id="view-work" class="view">
    <header class="topbar">
      <div class="logo"><span class="logo-c">C</span><span class="logo-cursor"></span></div>
      <div class="timer" id="timer" title="Time left"><svg><use href="#i-clock"/></svg><span id="timer-text">0h 30min</span></div>
      <div class="topbar-right"><button id="submit-btn" class="btn-submit"><svg><use href="#i-check"/></svg>Submit Assessment</button></div>
    </header>
    <div class="workspace" id="workspace">
      <nav class="rail">
        <div id="rail-tabs" class="rail-tabs"></div>
        <div class="rail-tools">
          <button class="icon-btn" data-action="toggle-theme" title="Switch dark / light"><svg><use href="#i-contrast"/></svg></button>
          <button class="icon-btn" data-action="settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
          <button class="icon-btn" data-action="help" title="Help"><svg><use href="#i-help"/></svg></button>
          <button class="icon-btn" data-action="leave" title="Leave"><svg><use href="#i-exit"/></svg></button>
        </div>
      </nav>
      <section class="panel task-panel" id="task-panel">
        <div class="panel-head"><span id="task-heading">Task 1</span>
          <button class="icon-btn chevron" id="collapse-task" title="Hide task description"><svg><use href="#i-chevron-left"/></svg></button></div>
        <div class="panel-body task-body" id="task-body"></div>
      </section>
      <div class="gutter gutter-v" id="gutter-task"></div>
      <section class="panel solution-panel">
        <div class="panel-head solution-head"><span>Solution</span>
          <label class="lang-select">Language: <select id="lang-select"></select></label></div>
        <div class="solution-body" id="solution-body">
          <div class="solution-top">
            <aside class="files">
              <div class="files-head">Files</div>
              <ul class="tree">
                <li class="folder"><svg><use href="#i-folder"/></svg><span id="folder-name">task1</span></li>
                <li class="file" data-file="solution"><svg><use href="#i-file"/></svg><span id="solution-filename">solution.java</span></li>
                <li class="file" data-file="tests"><svg><use href="#i-file"/></svg><span>test-input.txt</span></li>
              </ul>
            </aside>
            <div class="editor-col">
              <div class="tabbar" id="tabbar"></div>
              <div class="editor-wrap">
                <div id="editor" class="editor"></div>
                <div id="editor-empty" class="editor-empty" hidden>Open a file from the Files panel.</div>
                <div id="editor-loading" class="editor-empty">Loading editor…</div>
              </div>
              <div class="editor-foot">To leave editor use Ctrl + Shift + M</div>
            </div>
          </div>
          <div class="gutter gutter-h" id="gutter-output"></div>
          <div class="output" id="output-panel">
            <div class="output-main">
              <div class="output-head"><button class="link-btn" id="toggle-output">Test Output</button></div>
              <div class="output-body" id="output-body"></div>
            </div>
            <div class="output-actions">
              <div class="lang-version" id="lang-version">Language Version: Java SE 21</div>
              <button class="btn-run" id="run-btn"><svg><use href="#i-play"/></svg><span>Run code</span></button>
              <button class="link-btn feedback" data-action="notes">Give Feedback <svg><use href="#i-flag"/></svg></button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <footer class="statusbar"><span id="save-status">All changes saved</span></footer>
  </section>

  <!-- ============ MODAL / OVERLAY ============ -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><span id="modal-title"></span><button class="icon-btn" id="modal-x" title="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>
  <div class="overlay" id="overlay" hidden><div class="spinner"></div><div id="overlay-text">Working…</div></div>
  <div class="toast" id="toast" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M10.3 2.8h3.4l.5 2.4 1.8.8 2.1-1.3 2.4 2.4-1.3 2.1.8 1.8 2.4.5v3.4l-2.4.5-.8 1.8 1.3 2.1-2.4 2.4-2.1-1.3-1.8.8-.5 2.4h-3.4l-.5-2.4-1.8-.8-2.1 1.3-2.4-2.4 1.3-2.1-.8-1.8-2.4-.5v-3.4l2.4-.5.8-1.8-1.3-2.1 2.4-2.4 2.1 1.3 1.8-.8z"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M4 5h12v4M16 15v4H4V5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h11M17 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10v10H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4h11l-2 4 2 4H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
